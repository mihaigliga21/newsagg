[project]
name = "newsagg"
version = "0.1.0"
description = "Configurable news aggregator that posts a daily digest to a Telegram channel"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "croniter>=2.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "json-repair>=0.30",
    "psycopg[binary,pool]>=3.2",
    "psycopg-pool>=3.2",  # pool connection checks
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "selectolax>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
newsagg = "newsagg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsagg*"]

[tool.setuptools.package-data]
newsagg = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
