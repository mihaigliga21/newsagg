# newsagg configuration. ${VAR} values come from the environment (.env file with Docker).

database_url: ${DATABASE_URL}

channel:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  chat_id: ${TELEGRAM_CHANNEL_ID}            # e.g. @my_channel or -100123...
  review_chat_id: ${TELEGRAM_REVIEW_CHAT_ID}  # your private chat with the bot; drafts go here first
  language: ro
  timezone: Europe/Chisinau
  schedule: ["0 12 * * *", "0 17 * * *", "0 20 * * *", "0 22 * * *"]                     # daily; add more cron lines for more digests
  lookback_hours: 24
  max_extra_links: 3                           # links to other outlets that reported the same event, after its line
  max_per_subject: 2                           # at most 2 lines about the same person or organisation
  repeat_window_hours: 48                      # don't repeat events from digests sent (or awaiting review) this recently
  header: "📰 <b>Știrile zilei, {date}</b>"

# Order matters: sections appear in this order in the digest.
# 6 + 4 + 3 lines keep the digest inside one Telegram message (4096 characters).
sections:
  - id: moldova
    title: null                 # first block has no header, like Redactia
    regions: [moldova]
    max_items: 6
  - id: romania
    title: "::: ROMÂNIA"
    regions: [romania]
    max_items: 4
  - id: externe
    title: "::: EXTERNE"
    regions: [world]
    max_items: 3

# Order matters for keyword matching: the first region whose keywords hit wins.
# The LLM labeller uses the descriptions; keywords are the fallback when the LLM is off or fails.
regions:
  moldova:
    description: Republic of Moldova, including Transnistria and Gagauzia, and Moldovan diaspora
    keywords: [Moldov, Chișinău, Chisinau, Bălți, Balti, Transnistri, Tiraspol, Găgăuzi, Gagauzi, Comrat,
               Maia Sandu, Recean, Munteanu, Partidul Acțiune și Solidaritate, PSRM, Dodon, Grosu, Igor Grosu, Parlamentul de la Chișinău]
  romania:
    description: Romania (domestic Romanian news)
    keywords: [România, Romania, București, Bucuresti, Nicușor Dan, Bolojan, Guvernul României, PSD, PNL, USR, partidul AUR]
  world:
    description: International news outside Moldova and Romania (Ukraine, Russia, EU, USA, Middle East, etc.)
    keywords: [Ucrain, Kiev, Kyiv, Rusia, Rusiei, Moscov, Kremlin, Putin, Zelenski, Uniunea European, Bruxelles,
               NATO, SUA, Trump, Washington, China, Israel, Gaza, Iran, Turcia, Ungari, Bulgari, Polonia, Germania, Franța]
  other:
    description: Anything else (sport results, celebrities, lifestyle) that should not go in the digest

topics:
  politics:   {emoji: "🏛", keywords: [Parlament, guvern, ministr, partid, alegeri, deputat, premier, președint]}
  justice:    {emoji: "⚖️", keywords: [instanț, procuror, judecăt, dosar, CSM, CSJ, DNA, anticorupție, condamnat]}
  economy:    {emoji: "💰", keywords: [econom, buget, inflați, prețur, tarif, bancă, BNM, BNR, salari, pensi, taxe]}
  energy:     {emoji: "⚡", keywords: [energi, gaze, Moldovagaz, Energocom, curent electric, termoficare]}
  infrastructure: {emoji: "🛣", keywords: [drumul, drumuri, autostrad, podul, cale ferată, aeroport, apeduct]}
  security:   {emoji: "🛡", keywords: [armat, apărare, militar, SIS, securitat, poliți]}
  war:        {emoji: "💥", keywords: [atac, rachet, drone, bombard, front, ofensiv]}
  eu:         {emoji: "🇪🇺", keywords: [Uniunea European, Comisia European, Parlamentul European, aderare]}
  health:     {emoji: "🏥", keywords: [sănătat, spital, medic, vaccin, epidemi]}
  education:  {emoji: "🎓", keywords: [școal, elev, student, universit, bacalaureat, profesor]}
  society:    {emoji: "👥", keywords: [protest, social, diaspora, populați]}
  accident:   {emoji: "🚨", keywords: [accident, incendiu, explozi, victim, mort]}
  weather:    {emoji: "🌦", keywords: [meteo, ploi, ninsoare, caniculă, cod galben, cod portocaliu, inundați]}
  default:    {emoji: "📰"}

# priority: lower is better; when several outlets cover a story, the best-ranked one gets the link.
# Feeds marked "checked" returned valid RSS on 2026-10-08. Run `newsagg test-source <id>` to check any of them.
sources:
  # --- Moldova ---
  - {id: zdg,          type: rss, name: Ziarul de Gardă, url: "https://www.zdg.md/feed/",        region: moldova, priority: 1}  # checked
  - {id: newsmaker,    type: rss, name: NewsMaker,       url: "https://newsmaker.md/ro/feed/",   region: moldova, priority: 1}  # checked
  - {id: tv8,          type: rss, name: TV8,             url: "https://tv8.md/feed",             region: moldova, priority: 2}  # checked
  - {id: unimedia,     type: rss, name: Unimedia,        url: "https://unimedia.info/ro/rss/all/", region: moldova, priority: 2}  # checked
  - {id: moldova1,     type: rss, name: Moldova 1,       url: "https://moldova1.md/rss",         region: moldova, priority: 1}  # checked 2026-10-24
  - {id: protv_md,     type: rss, name: PRO TV Chișinău, url: "https://protv.md/rss",            region: moldova, priority: 2}  # checked 2026-10-24
  - {id: moldpres,     type: rss, name: Moldpres,        url: "https://moldpres.md/config/rss.php?lang=rom", region: moldova, priority: 3}  # checked 2026-10-24; state news agency
  # Europa Liberă Moldova has no all-news feed, only sections; not checked (robots block the fetch tool)
  - {id: rel_md_politica, type: rss, name: Europa Liberă, url: "https://www.europalibera.md/api/ztuymil-vomx-tpekiumi", region: moldova, priority: 1}
  - {id: rel_md_social,   type: rss, name: Europa Liberă, url: "https://www.europalibera.md/api/zkbympl-vomx-tpejvumm", region: moldova, priority: 1}
  - {id: rel_md_economie, type: rss, name: Europa Liberă, url: "https://www.europalibera.md/api/z-bymyl-vomx-tpertumv", region: moldova, priority: 1}
  - {id: rel_md_justitie, type: rss, name: Europa Liberă, url: "https://www.europalibera.md/api/z_bymvl-vomx-tpevvumt", region: moldova, priority: 1}
  - {id: diez,         type: rss, name: Diez,            url: "https://diez.md/feed/",           region: moldova, priority: 5}  # checked
  # Dropped on 2026-10-24 after the source trust review; kept here disabled so older stories still show their names.
  - {id: point,        type: rss, name: Point.md,        url: "https://point.md/ro/rss",         region: moldova, enabled: false}  # PressCheck: unverified/false single-source claims
  - {id: realitatea_md, type: rss, name: Realitatea.md,  url: "https://realitatea.md/feed/",     region: moldova, enabled: false}
  - {id: ipn,          type: rss, name: IPN,             url: "https://www.ipn.md/ro/feed",      region: moldova, enabled: false}  # same owner as Realitatea.md

  # --- Romania ---
  - {id: digi24,       type: rss, name: Digi24,          url: "https://www.digi24.ro/rss",       region: romania, priority: 1}  # checked
  - {id: g4media,      type: rss, name: G4Media,         url: "https://www.g4media.ro/feed",     region: romania, priority: 1}  # checked
  - {id: hotnews,      type: rss, name: HotNews,         url: "https://hotnews.ro/feed",         region: romania, priority: 1}  # checked
  - {id: newsro,       type: rss, name: News.ro,         url: "https://www.news.ro/rss",         region: romania, priority: 2}  # checked
  - {id: mediafax,     type: rss, name: Mediafax,        url: "https://www.mediafax.ro/rss",     region: romania, priority: 3}  # checked
  - {id: spotmedia,    type: rss, name: Spotmedia,       url: "https://spotmedia.ro/feed",       region: romania, priority: 2}  # checked
  - {id: recorder,     type: rss, name: Recorder,        url: "https://recorder.ro/feed/",       region: romania, priority: 1, interval_minutes: 60}  # checked
  - {id: libertatea,   type: rss, name: Libertatea,      url: "https://www.libertatea.ro/rss",   region: romania, priority: 3, enabled: false}  # not checked
  - {id: adevarul,     type: rss, name: Adevărul,        url: "https://adevarul.ro/rss",         region: romania, enabled: false}  # dropped 2026-10-24

  # --- International, in Romanian ---
  - {id: digi24_externe, type: rss, name: Digi24 Externe, url: "https://www.digi24.ro/rss/stiri/externe", region: world, priority: 1}  # checked
  - {id: dw_ro,        type: rss, name: DW România,      url: "https://rss.dw.com/rdf/rss-rom-all", region: world, priority: 2, enabled: false}  # not checked

  # --- International, in English (the writer still writes the digest lines in Romanian) ---
  - {id: euronews,     type: rss, name: Euronews,        url: "https://www.euronews.com/rss",    region: world, priority: 2}  # checked 2026-10-24
  - {id: bbc_world,    type: rss, name: BBC,             url: "https://feeds.bbci.co.uk/news/world/rss.xml", region: world, priority: 2}  # not checked (blocked from here)
  - {id: kyiv_independent, type: rss, name: Kyiv Independent, url: "https://kyivindependent.com/news-archive/rss/", region: world, priority: 3}  # checked 2026-10-24

  # --- Telegram channels (public web preview, no login) ---
  # - {id: some_channel, type: telegram, channel: some_public_channel, region: moldova, priority: 4}

  # --- Websites without a feed ---
  # - {id: some_site, type: website, url: "https://example.md/stiri", link_selector: "article h2 a", region: moldova}

filter:
  max_age_hours: 36
  blocklist: [horoscop, rețet, reteta, "(P)", publicitate, "cod de reducere", promoți, "ce mâncăm", bancul zilei]

dedupe:
  window_hours: 48
  title_similarity: 80     # 0-100; lower merges more aggressively
  min_tokens: 4
  llm_recent_stories: 150  # the LLM labeller checks new items against this many recent stories (same event -> one story)
  digest_similarity: 70    # at digest time, titles this similar count as one event (safety net for the LLM grouping)

llm:
  enabled: true
  # anthropic, openai_compatible (OpenAI, Gemini, Mistral, Groq, OpenRouter) or ollama (a local model).
  # LLM_PROVIDER and LLM_MODEL in .env override these, so you can switch without editing this file.
  provider: ${LLM_PROVIDER:-openai_compatible}
  model: ${LLM_MODEL:-anthropic/claude-haiku-5.5}
  api_key: ${LLM_API_KEY}
  base_url: ${LLM_BASE_URL:-}  # openai_compatible: e.g. https://api.openai.com/v1; ollama: default http://host.docker.internal:11434
  effort: low                  # anthropic only
  # ollama only (see "Local models with Ollama" in the README):
  num_ctx: 16384               # context window; the labelling and grouping prompts need about 10k tokens
  think: false                 # no thinking mode for reasoning models such as qwen3: much faster
  keep_alive: 30m              # keep the model loaded between batches
  classify: true
  write_lines: true
  curate: true                 # at digest time, group lines by event and keep one per event
  batch_size: 20
  min_importance: 3            # stories below this are kept for dedupe but get no line

worker:
  poll_seconds: 60
  batch_size: 50
